<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debate Timer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23fff' stroke-width='14'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Warning flash vignette -->
    <div id="flash" class="flash" aria-hidden="true"></div>

    <header class="top">
      <button id="btn-menu" class="btn btn-lime btn-gear" data-i18n-title="menuTitle" title="Settings (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg><span data-i18n="menu">Settings</span></button>
      <h1 id="title" class="title">Debate Timer</h1>
      <div class="top-right">
        <button id="btn-reload" class="btn btn-lime" data-i18n="reload">Reload Scene</button>
        <button id="btn-fullscreen" class="btn btn-lime btn-icon" data-i18n-title="fullscreen" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button>
      </div>
    </header>

    <main class="stage">
      <div class="side pro">
        <div id="pro-label" class="side-label"></div>
        <div id="pro-column" class="speakers pro"></div>
      </div>

      <section class="center">
        <!-- Single ring timer (prep + speakers) -->
        <div id="ring-timer" class="ring-timer hidden">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 100 100">
              <circle id="ring-bg" class="ring-bg" cx="50" cy="50" r="44" />
              <circle id="ring-fg" class="ring-fg" cx="50" cy="50" r="44" />
            </svg>
            <div id="ring-text" class="ring-text">0:00</div>
          </div>
          <div class="controls">
            <button id="ring-start" class="btn btn-mint" data-i18n="start">Start</button>
            <button id="ring-pause" class="btn btn-blue" data-i18n="pause">Pause</button>
            <button id="ring-resume" class="btn btn-mint" data-i18n="resume">Resume</button>
            <button id="ring-out" class="btn btn-grey" disabled data-i18n="timeout">Time ran out</button>
            <button id="ring-reset" class="btn btn-red" data-i18n="reset">Reset</button>
          </div>
        </div>

        <!-- Double bar timer (free debate) -->
        <div id="double-timer" class="double-timer hidden">
          <div class="bar-timer" data-side="pro">
            <div class="bar-label">
              <img class="icon-timer" src="assets/icons/timer-icon.png" alt="" />
              <img class="icon-arrow" src="assets/icons/arrow-1.png" alt="" />
            </div>
            <div class="bar-wrap">
              <div class="bar-bg"></div>
              <div class="bar-fg"></div>
            </div>
            <div class="bar-text">0:00</div>
            <div class="bar-controls">
              <button class="btn btn-mint bar-start" data-i18n="start">Start</button>
              <button class="btn btn-blue bar-pause" data-i18n="pause">Pause</button>
              <button class="btn btn-mint bar-resume" data-i18n="resume">Resume</button>
              <button class="btn btn-grey bar-out" disabled data-i18n="timeout">Time ran out</button>
              <button class="btn btn-red bar-reset" data-i18n="reset">Reset</button>
            </div>
          </div>

          <button id="btn-invert" class="invert-btn">
            <img src="assets/icons/swap-icon.png" alt="" />
            <span data-i18n="invert">Invert</span>
          </button>

          <div class="bar-timer" data-side="con">
            <div class="bar-label">
              <img class="icon-timer" src="assets/icons/timer-icon.png" alt="" />
              <img class="icon-arrow" src="assets/icons/arrow-1.png" alt="" />
            </div>
            <div class="bar-wrap">
              <div class="bar-bg"></div>
              <div class="bar-fg"></div>
            </div>
            <div class="bar-text">0:00</div>
            <div class="bar-controls">
              <button class="btn btn-mint bar-start" data-i18n="start">Start</button>
              <button class="btn btn-blue bar-pause" data-i18n="pause">Pause</button>
              <button class="btn btn-mint bar-resume" data-i18n="resume">Resume</button>
              <button class="btn btn-grey bar-out" disabled data-i18n="timeout">Time ran out</button>
              <button class="btn btn-red bar-reset" data-i18n="reset">Reset</button>
            </div>
          </div>
        </div>
      </section>

      <div class="side con">
        <div id="con-label" class="side-label"></div>
        <div id="con-column" class="speakers con"></div>
      </div>
    </main>

    <footer class="bottom">
      <button id="btn-next" class="btn btn-mint btn-next" data-i18n="begin">Begin</button>
      <div class="timeline">
        <div id="timeline-buttons" class="timeline-buttons"></div>
        <div class="timeline-line"></div>
      </div>
    </footer>

    <!-- Settings panel -->
    <div id="menu-overlay" class="overlay hidden">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <div class="panel-head">
          <h2 id="panel-title" data-i18n="editSave">Settings</h2>
          <div class="panel-head-right">
            <button id="btn-lang" class="btn btn-quiet sm">中文</button>
            <button id="btn-close" class="icon-btn" data-i18n-title="close" title="Close" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
        <div class="panel-main">
          <nav id="settings-nav" class="snav" role="tablist" aria-orientation="vertical"></nav>
          <div class="panel-body">
            <form id="settings-form" class="settings" autocomplete="off"></form>
          </div>
        </div>
        <div id="editor-error" class="editor-error" role="alert"></div>
        <div id="panel-foot" class="panel-foot">
          <span id="foot-note" class="foot-note" aria-live="polite"></span>
          <div class="foot-actions">
            <button id="btn-discard" class="btn btn-quiet" data-i18n="discard">Discard changes</button>
            <button id="btn-save" class="btn btn-mint">Save &amp; Apply</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Save / edit preset -->
    <div id="preset-overlay" class="overlay confirm hidden">
      <form id="preset-dialog" class="confirm-card preset-dialog" role="dialog" aria-modal="true" aria-labelledby="preset-dialog-title" autocomplete="off">
        <h2 id="preset-dialog-title">Save as preset</h2>
        <p id="preset-dialog-text"></p>
        <label class="fstack"><span class="flabel" data-i18n="pdName">Name</span><input id="preset-name" type="text" maxlength="60" required /></label>
        <div class="fstack"><span class="flabel" data-i18n="pdIcon">Icon</span><div id="preset-icons" class="icon-grid" role="radiogroup"></div></div>
        <label id="preset-update-row" class="check-row"><input id="preset-update" type="checkbox" /><span data-i18n="pdUpdate">Also replace what it holds with the current setup</span></label>
        <div class="panel-actions">
          <button type="button" id="preset-cancel" class="btn btn-quiet" data-i18n="cancel">Cancel</button>
          <button type="submit" id="preset-ok" class="btn btn-mint">Save preset</button>
        </div>
      </form>
    </div>

    <!-- Confirm prompt -->
    <div id="confirm-overlay" class="overlay confirm hidden">
      <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
        <h2 id="confirm-title" data-i18n="unsavedTitle">Unsaved changes</h2>
        <p id="confirm-text" data-i18n="unsavedText">You changed the settings. Save and apply them?</p>
        <div class="panel-actions">
          <button id="confirm-cancel" class="btn btn-quiet" data-i18n="keepEditing">Keep editing</button>
          <button id="confirm-discard" class="btn btn-yellow" data-i18n="discard">Discard</button>
          <button id="confirm-save" class="btn btn-mint" data-i18n="saveApply">Save &amp; Apply</button>
        </div>
      </div>
    </div>

    <!-- End screen -->
    <div id="end-overlay" class="overlay hidden">
      <div class="end-card">
        <h2 data-i18n="ended">Debate Ended</h2>
        <div class="panel-actions">
          <button id="btn-end-close" class="btn btn-mint" data-i18n="close">Close</button>
          <button id="btn-end-reload" class="btn btn-lime" data-i18n="reload">Reload Scene</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-warning" src="assets/audio/warning.wav" preload="auto"></audio>
  <audio id="audio-end" src="assets/audio/bell.ogg" preload="auto"></audio>
  <input id="audio-file-input" type="file" accept="audio/*" hidden />
  <input id="file-input" type="file" accept="application/json,.json" hidden />

  <script src="app.js"></script>
</body>
</html>
