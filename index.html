<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debate Timer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23fff' stroke-width='14'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Warning flash vignette -->
    <div id="flash" class="flash" aria-hidden="true"></div>

    <header class="top">
      <div class="top-left">
        <button id="btn-menu" class="btn btn-tonal btn-gear" data-i18n-title="menuTitle" title="Settings (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.3a1.8 1.8 0 0 1 3.4 0l.3.9a1.8 1.8 0 0 0 2.5 1l.8-.4a1.8 1.8 0 0 1 2.4 2.4l-.4.8a1.8 1.8 0 0 0 1 2.5l.9.3a1.8 1.8 0 0 1 0 3.4l-.9.3a1.8 1.8 0 0 0-1 2.5l.4.8a1.8 1.8 0 0 1-2.4 2.4l-.8-.4a1.8 1.8 0 0 0-2.5 1l-.3.9a1.8 1.8 0 0 1-3.4 0l-.3-.9a1.8 1.8 0 0 0-2.5-1l-.8.4a1.8 1.8 0 0 1-2.4-2.4l.4-.8a1.8 1.8 0 0 0-1-2.5l-.9-.3a1.8 1.8 0 0 1 0-3.4l.9-.3a1.8 1.8 0 0 0 1-2.5l-.4-.8a1.8 1.8 0 0 1 2.4-2.4l.8.4a1.8 1.8 0 0 0 2.5-1Z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="menu">Settings</span></button>
        <button id="btn-fullscreen" class="btn btn-tonal btn-icon" data-i18n-title="fullscreen" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/></svg></button>
      </div>
      <h1 id="title" class="title"><span id="title-eyebrow" class="title-eyebrow"></span><span class="title-main"><i id="title-dot" class="title-dot" aria-hidden="true"></i><span id="title-text" class="title-text">Debate Timer</span></span></h1>
      <div class="top-right">
        <button id="btn-reload" class="btn btn-tonal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span data-i18n="reload">Reload Scene</span></button>
      </div>
    </header>

    <main class="stage">
      <div class="side pro">
        <div id="pro-label" class="side-label"></div>
        <div id="pro-column" class="speakers pro"></div>
      </div>

      <section class="center">
        <!-- Before the round -->
        <div id="idle-hint" class="idle hidden" aria-live="polite">
          <div class="idle-who">
            <span class="idle-eyebrow" data-i18n="firstUp">First up</span>
            <span id="idle-name" class="idle-name"></span>
          </div>
          <div class="idle-ring">
            <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
              <circle class="idle-ring-bg" cx="50" cy="50" r="44" />
              <circle class="idle-ring-fg" cx="50" cy="50" r="44" />
            </svg>
            <div id="idle-time" class="idle-time">0:00</div>
          </div>
          <div class="idle-round">
            <div id="idle-bar" class="idle-bar" aria-hidden="true"></div>
            <div id="idle-total" class="idle-total"></div>
          </div>
          <p id="idle-text" class="idle-text"></p>
        </div>

        <!-- Single ring timer (prep + speakers) -->
        <div id="ring-timer" class="ring-timer hidden">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 100 100">
              <circle id="ring-bg" class="ring-bg" cx="50" cy="50" r="44" />
              <circle id="ring-fg" class="ring-fg" cx="50" cy="50" r="44" />
            </svg>
            <div id="ring-text" class="ring-text">0:00</div>
          </div>
          <div class="controls">
            <button id="ring-start" class="btn btn-primary"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4.9v14.2a1.4 1.4 0 0 0 2.1 1.2l11.2-7.1a1.4 1.4 0 0 0 0-2.4L10.1 3.7A1.4 1.4 0 0 0 8 4.9Z"/></svg></span><span data-i18n="start">Start</span></button>
            <button id="ring-pause" class="btn btn-tonal"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.6"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.6"/></svg></span><span data-i18n="pause">Pause</span></button>
            <button id="ring-resume" class="btn btn-primary"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4.9v14.2a1.4 1.4 0 0 0 2.1 1.2l11.2-7.1a1.4 1.4 0 0 0 0-2.4L10.1 3.7A1.4 1.4 0 0 0 8 4.9Z"/></svg></span><span data-i18n="resume">Resume</span></button>
            <button id="ring-out" class="btn btn-alert" disabled><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4.5M12 17v.01M9.5 2.5h5"/></svg></span><span data-i18n="timeout">Time ran out</span></button>
            <button id="ring-reset" class="btn btn-tonal btn-reset"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg></span><span data-i18n="reset">Reset</span></button>
          </div>
        </div>

        <!-- Double bar timer (free debate) -->
        <div id="double-timer" class="double-timer hidden">
          <div class="bar-timer" data-side="pro">
            <div class="bar-label" aria-hidden="true"></div>
            <div class="bar-wrap">
              <div class="bar-bg"></div>
              <div class="bar-fg"></div>
            </div>
            <div class="bar-text">0:00</div>
            <div class="bar-controls">
              <button class="btn bar-start btn-primary"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4.9v14.2a1.4 1.4 0 0 0 2.1 1.2l11.2-7.1a1.4 1.4 0 0 0 0-2.4L10.1 3.7A1.4 1.4 0 0 0 8 4.9Z"/></svg></span><span data-i18n="start">Start</span></button>
              <button class="btn bar-pause btn-tonal"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.6"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.6"/></svg></span><span data-i18n="pause">Pause</span></button>
              <button class="btn bar-resume btn-primary"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4.9v14.2a1.4 1.4 0 0 0 2.1 1.2l11.2-7.1a1.4 1.4 0 0 0 0-2.4L10.1 3.7A1.4 1.4 0 0 0 8 4.9Z"/></svg></span><span data-i18n="resume">Resume</span></button>
              <button class="btn bar-out btn-alert" disabled><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4.5M12 17v.01M9.5 2.5h5"/></svg></span><span data-i18n="timeout">Time ran out</span></button>
              <button class="btn bar-reset btn-tonal btn-reset"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg></span><span data-i18n="reset">Reset</span></button>
            </div>
          </div>

          <button id="btn-invert" class="invert-btn" data-i18n-title="invertTitle" title="Invert (I)">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 17h28"/><path d="M29 9l8 8-8 8"/><path d="M40 31H12"/><path d="M19 23l-8 8 8 8"/></svg>
            <span data-i18n="invert">Invert</span>
          </button>

          <div class="bar-timer" data-side="con">
            <div class="bar-label" aria-hidden="true"></div>
            <div class="bar-wrap">
              <div class="bar-bg"></div>
              <div class="bar-fg"></div>
            </div>
            <div class="bar-text">0:00</div>
            <div class="bar-controls">
              <button class="btn bar-start btn-primary"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4.9v14.2a1.4 1.4 0 0 0 2.1 1.2l11.2-7.1a1.4 1.4 0 0 0 0-2.4L10.1 3.7A1.4 1.4 0 0 0 8 4.9Z"/></svg></span><span data-i18n="start">Start</span></button>
              <button class="btn bar-pause btn-tonal"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.6"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.6"/></svg></span><span data-i18n="pause">Pause</span></button>
              <button class="btn bar-resume btn-primary"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4.9v14.2a1.4 1.4 0 0 0 2.1 1.2l11.2-7.1a1.4 1.4 0 0 0 0-2.4L10.1 3.7A1.4 1.4 0 0 0 8 4.9Z"/></svg></span><span data-i18n="resume">Resume</span></button>
              <button class="btn bar-out btn-alert" disabled><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4.5M12 17v.01M9.5 2.5h5"/></svg></span><span data-i18n="timeout">Time ran out</span></button>
              <button class="btn bar-reset btn-tonal btn-reset"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg></span><span data-i18n="reset">Reset</span></button>
            </div>
          </div>
        </div>
      </section>

      <div class="side con">
        <div id="con-label" class="side-label"></div>
        <div id="con-column" class="speakers con"></div>
      </div>
    </main>

    <footer class="bottom">
      <button id="btn-prev" class="btn btn-tonal btn-step btn-prev" data-i18n-title="backTitle" title="Back (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12h-15M10.5 6l-6 6 6 6"/></svg><span class="next-text"><span data-i18n="back">Back</span><small id="btn-prev-sub"></small></span></button>
      <nav class="timeline" aria-label="Order of speeches">
        <div id="timeline-buttons" class="tl-steps"></div>
      </nav>
      <button id="btn-next" class="btn btn-primary btn-step btn-next"><span class="next-text"><span id="btn-next-label">Begin</span><small id="btn-next-sub"></small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></svg></button>
    </footer>

    <!-- Settings panel -->
    <div id="menu-overlay" class="overlay hidden">
      <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <div class="panel-head">
          <h2 id="panel-title" data-i18n="editSave">Settings</h2>
          <div class="panel-head-right">
            <button id="btn-lang" class="btn btn-quiet sm">中文</button>
            <button id="btn-close" class="icon-btn" data-i18n-title="close" title="Close" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
        <div class="panel-main">
          <nav id="settings-nav" class="snav" role="tablist" aria-orientation="vertical"></nav>
          <div class="panel-body">
            <form id="settings-form" class="settings" autocomplete="off"></form>
          </div>
        </div>
        <div id="editor-error" class="editor-error" role="alert"></div>
        <div id="panel-foot" class="panel-foot">
          <span id="foot-note" class="foot-note" aria-live="polite"></span>
          <div class="foot-actions">
            <button id="btn-discard" class="btn btn-quiet" data-i18n="discard">Discard changes</button>
            <button id="btn-save" class="btn btn-mint">Save &amp; Apply</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Save / edit preset -->
    <div id="preset-overlay" class="overlay confirm hidden">
      <form id="preset-dialog" class="confirm-card preset-dialog" role="dialog" aria-modal="true" aria-labelledby="preset-dialog-title" autocomplete="off">
        <h2 id="preset-dialog-title">Save as preset</h2>
        <p id="preset-dialog-text"></p>
        <label class="fstack"><span class="flabel" data-i18n="pdName">Name</span><input id="preset-name" type="text" maxlength="60" required /></label>
        <div class="fstack"><span class="flabel" data-i18n="pdIcon">Icon</span><div id="preset-icons" class="icon-grid" role="radiogroup"></div></div>
        <label id="preset-update-row" class="check-row"><input id="preset-update" type="checkbox" /><span data-i18n="pdUpdate">Also replace what it holds with the current setup</span></label>
        <div class="panel-actions">
          <button type="button" id="preset-cancel" class="btn btn-quiet" data-i18n="cancel">Cancel</button>
          <button type="submit" id="preset-ok" class="btn btn-mint">Save preset</button>
        </div>
      </form>
    </div>

    <!-- Confirm prompt -->
    <div id="confirm-overlay" class="overlay confirm hidden">
      <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
        <h2 id="confirm-title" data-i18n="unsavedTitle">Unsaved changes</h2>
        <p id="confirm-text" data-i18n="unsavedText">You changed the settings. Save and apply them?</p>
        <div class="panel-actions">
          <button id="confirm-cancel" class="btn btn-quiet" data-i18n="keepEditing">Keep editing</button>
          <button id="confirm-discard" class="btn btn-yellow" data-i18n="discard">Discard</button>
          <button id="confirm-save" class="btn btn-mint" data-i18n="saveApply">Save &amp; Apply</button>
        </div>
      </div>
    </div>

    <!-- End screen -->
    <div id="end-overlay" class="overlay hidden">
      <div class="end-card">
        <h2 data-i18n="ended">Debate Ended</h2>
        <div class="panel-actions">
          <button id="btn-end-close" class="btn btn-tonal" data-i18n="close">Close</button>
          <button id="btn-end-reload" class="btn btn-primary" data-i18n="reload">Reload Scene</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-warning" src="assets/audio/warning.wav" preload="auto"></audio>
  <audio id="audio-end" src="assets/audio/bell.ogg" preload="auto"></audio>
  <input id="audio-file-input" type="file" accept="audio/*" hidden />
  <input id="file-input" type="file" accept="application/json,.json" hidden />

  <script src="app.js"></script>
</body>
</html>
